# SKY LINK 蓝天联盟 — nginx vhost
#
# 部署位置：/etc/nginx/sites-enabled/skylink.conf
# 站点根目录：/var/www/skylink
#
# 域名走 Cloudflare 代理（橙色云朵），源站只需监听 80 端口，
# HTTPS 由 Cloudflare 终结，因此这里不配置证书。

server {
    listen 80;
    listen [::]:80;
    server_name skylink.199265.xyz;

    root /var/www/skylink;
    index index.html;

    charset utf-8;

    # gzip：文本资源压缩后再传
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml;

    # 静态资源缓存 1 小时。
    # 不要用 immutable + 长期缓存：一旦某次 404 被缓存，用户会长期看到破图，
    # 而服务端自测一切正常，极难排查。（主站踩过这个坑）
    location ~* \.(css|js|png|jpe?g|gif|svg|webp|ico|woff2?)$ {
        expires 1h;
        access_log off;
        try_files $uri =404;
    }

    # web manifest：nginx 自带的 mime.types 里没有 .webmanifest，
    # 不显式指定会以 application/octet-stream 返回，浏览器可能忽略它。
    location = /site.webmanifest {
        types { }
        default_type application/manifest+json;
        expires 1h;
    }

    # HTML 不缓存，保证改完立刻生效
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # 自定义 404 回到首页（单页站点，没有独立 404 页）
    error_page 404 /index.html;

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }
}
