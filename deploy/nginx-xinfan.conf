server {
    listen 80;
    server_name 107.174.152.24 xinfan.199265.xyz;
    client_max_body_size 10M;

    location = /5245070195fc163a6d7e3927ecac8193.txt {
        return 200 '7d13c19ea2635efa621af4db13ff59f9e04643ff';
        add_header Content-Type text/plain;
    }

    location /media/ {
        alias /opt/xinfan-airlines/media/;
    }

    # 只缓存 1 小时，不要用 immutable + 30d：
    # 一旦某个缓存层记下过一次 404（例如静态文件尚未 collectstatic），
    # 用户会长期看到破图，而服务端自测一切正常，极难排查。
    #
    # 只用 expires，不要再 add_header Cache-Control：
    # expires 本身就会生成 Cache-Control，两者叠加会发出重复的
    # Cache-Control 头，下游 CDN 可能取错值。
    location /static/ {
        alias /opt/xinfan-airlines/staticfiles/;
        expires 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
