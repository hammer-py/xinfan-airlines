server {
    listen 80;
    server_name 107.174.152.24 xinfan.199265.xyz;
    client_max_body_size 10M;

    location = /5245070195fc163a6d7e3927ecac8193.txt {
        return 200 '7d13c19ea2635efa621af4db13ff59f9e04643ff';
        add_header Content-Type text/plain;
    }

    location /media/ {
        alias /opt/xinfan-airlines/media/;
    }

    # Cache for 1 hour only. Do NOT use "immutable" + 30d here:
    # once any cache layer records a 404 (e.g. static files not collected
    # yet), users keep seeing broken images while every server-side check
    # looks healthy, which is very hard to diagnose.
    #
    # Use "expires" alone; do not add_header Cache-Control as well.
    # "expires" already emits Cache-Control, and adding it again sends a
    # duplicate header that downstream CDNs may read incorrectly.
    location /static/ {
        alias /opt/xinfan-airlines/staticfiles/;
        expires 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
