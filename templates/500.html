{% extends 'base.html' %}
{% block title %}服务器错误 Server Error — Xinfan Airlines{% endblock %}
{% block content %}
<div class="text-center py-5 my-5">
    <div style="font-size:5rem;font-weight:800;color:var(--accent);line-height:1">500</div>
    <h2 class="mt-3 mb-2">
        <span class="lang-zh">服务器出错了</span>
        <span class="lang-en">Something Went Wrong</span>
    </h2>
    <p class="text-secondary mb-4">
        <span class="lang-zh">我们已记录该问题，请稍后重试。</span>
        <span class="lang-en">The issue has been logged. Please try again later.</span>
    </p>
    <a href="{% url 'home' %}" class="btn btn-primary">
        <span class="lang-zh">返回首页</span>
        <span class="lang-en">Back to Home</span>
    </a>
</div>
{% endblock %}
