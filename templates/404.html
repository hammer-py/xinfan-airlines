{% extends 'base.html' %}
{% block title %}页面不存在 Page Not Found — Xinfan Airlines{% endblock %}
{% block content %}
<div class="text-center py-5 my-5">
    <div style="font-size:5rem;font-weight:800;color:var(--accent);line-height:1">404</div>
    <h2 class="mt-3 mb-2">
        <span class="lang-zh">页面不存在</span>
        <span class="lang-en">Page Not Found</span>
    </h2>
    <p class="text-secondary mb-4">
        <span class="lang-zh">您访问的页面已被移除或从未存在。</span>
        <span class="lang-en">The page you requested has been removed or never existed.</span>
    </p>
    <a href="{% url 'home' %}" class="btn btn-primary">
        <span class="lang-zh">返回首页</span>
        <span class="lang-en">Back to Home</span>
    </a>
</div>
{% endblock %}
